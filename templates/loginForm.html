<form method="post" action="?action={{ACTION}}">
    <fieldset class="card card-body">
        <legend class="visually-hidden">{{BUTTONTEXT}}</legend>
        <h1 class="login-title">{{BRAND}}</h1>
        <div class="form-outline mb-3">
            <label for="username" class="form-label">Username:</label>
            <input      type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        value=""
                        required>
        </div>

        <div class="form-group mb-3">
            <label for="password" class="form-label">Password:</label>
            <input      type="password"
                        name="password"
                        id="password"
                        minlength="8"
                        class="form-control"
                        value=""
                        required>
        </div>

        <div class="form-outline mb-3">
            <label for="method" class="form-label">Login method:</label>
            <select     name="method"
                        id="method"
                        class="form-select"
                        required>
                {{METHODS}}
            </select>
        </div>

        <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
        <div class="d-flex justify-content-center mt-4">
            <button type="submit" class="btn btn-primary w-100">{{BUTTONTEXT}}</button>
        </div>
    </fieldset>
</form>

<p class="login-info"><a href="?action=about">More information about this cluster</a></p>

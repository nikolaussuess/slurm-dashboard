<form method="post" action="?{{ACTION}}">
    <fieldset class="border p-2">
        <legend class="w-auto">Filter jobs:</legend>

        <div class="form-outline mb-4">
            <label for="time_min">Show jobs between</label>
            <input
                    type="datetime-local"
                    id="time_min"
                    name="form_time_min"
                    class="form-control d-inline-block w-auto"
                    value="{{TIME_MIN_VALUE}}"
                    min="1970-01-01T00:00"
                    max="2033-12-31T23:59"
            />
            <label for="time_max">and</label>
            <input
                    type="datetime-local"
                    id="time_max"
                    name="form_time_max"
                    class="form-control d-inline-block w-auto"
                    value="{{TIME_MAX_VALUE}}"
                    min="1970-01-01T00:00"
                    max="2033-12-31T23:59"
            /> <span class="text-muted">(default: today midnight to now)</span>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapsefilter"
                    aria-expanded="false" aria-controls="collapsefilter">
                Show/Hide more
            </button>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <span class="text-muted small d-none d-sm-inline">Quick filters:</span>
                <div class="btn-group" role="group" aria-label="State filter shortcuts">
                    <button class="btn btn-outline-success{{ACTIVE_COMPLETED}}" type="button" data-states="COMPLETED"
                            data-bs-toggle="tooltip" data-bs-placement="left" aria-pressed="{{PRESSED_COMPLETED}}"
                            title="Show completed jobs only" aria-label="Show completed jobs only">
                        &#10004;
                    </button>
                    <button class="btn btn-outline-info{{ACTIVE_RUNNING}}" type="button" data-states="COMPLETING,CONFIGURING,RUNNING"
                            data-bs-toggle="tooltip" data-bs-placement="left" aria-pressed="{{PRESSED_RUNNING}}"
                            title="Show running jobs only" aria-label="Show running jobs only">
                        &#9654;
                    </button>
                    <button class="btn btn-outline-danger{{ACTIVE_FAILED}}" type="button" data-state-class="state-fail"
                            data-bs-toggle="tooltip" data-bs-placement="left" aria-pressed="{{PRESSED_FAILED}}"
                            title="Show failed states only" aria-label="Show failed states only">
                        &#10006;
                    </button>
                    <button class="btn btn-outline-warning{{ACTIVE_WAITING}}" type="button" data-state-class="state-other"
                            data-bs-toggle="tooltip" data-bs-placement="left" aria-pressed="{{PRESSED_WAITING}}"
                            title="Show waiting states only" aria-label="Show waiting states only">
                        &#8987;
                    </button>
                </div>
                <button class="btn btn-outline-secondary{{ACTIVE_OWN_USER}}" type="button" id="btn-own-jobs-only"
                        data-current-user="{{CURRENT_USER}}" data-bs-toggle="tooltip" data-bs-placement="left"
                        aria-pressed="{{PRESSED_OWN_USER}}"
                        title="Show own jobs only" aria-label="Show own jobs only">
                    &#128100;
                </button>
            </div>
        </div>

        <div class="collapse mt-2" id="collapsefilter">
            <div class="card card-body">
                <div class="row">
                    <div class="col-md-6 form-outline mb-4">
                        <label for="form_account">Account:</label>
                        <select class="form-control multiselect-search" name="form_account[]" id="form_account" multiple>
                            {{ACCOUNT_SELECTS}}
                        </select>
                    </div>

                    <div class="col-md-6 form-outline mb-4">
                        <label for="form_partition">Partition:</label>
                        <select class="form-control multiselect-search" name="form_partition[]" id="form_partition" multiple>
                            {{PARTITION_SELECTS}}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-outline mb-4">
                        <label for="form_user">User:</label>
                        <select class="form-control multiselect-search" name="form_user[]" id="form_user" multiple>
                            {{USER_SELECTS}}
                        </select>
                    </div>

                    <div class="col-md-6 form-outline mb-4">
                        <label for="form_nodename">Node name:</label>
                        <select class="form-control multiselect-search" name="form_nodename[]" id="form_nodename" multiple>
                            {{NODE_SELECTS}}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-outline mb-4">
                        <label for="job_name">Job name:</label>
                        <input type="text"
                               name="form_job_name"
                               id="job_name"
                               class="form-control"
                               value="{{JOB_NAME}}">
                    </div>

                    <div class="col-md-6 form-outline mb-4">
                        <label for="constraints">Constraints:</label>
                        <input type="text"
                               name="form_constraints"
                               id="constraints"
                               class="form-control"
                               value="{{CONSTRAINTS}}">
                    </div>
                </div>

                <div class="form-outline mb-4">
                    <label for="form_state">State:</label>
                    <select class="form-control multiselect-search" name="form_state[]" id="form_state" multiple>
                        {{STATE_SELECTS}}
                    </select>
                </div>
            </div>
        </div>

        <p class="mt-2 mb-3 text-muted">Empty fields are ignored.</p>

        <div class="row mb-3">
            <a href="?action=job_history" class="btn btn-secondary col-sm-4 mt-3">Reset</a>
            <div class="col-sm-1"></div>
            <button type="submit" class="btn btn-primary col-sm-7 mt-3">Filter</button>
        </div>
    </fieldset>
</form>
